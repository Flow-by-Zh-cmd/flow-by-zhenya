<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Flow by Zhenya</title>
<script src="/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f3f7);
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --link:var(--tg-theme-link-color,#2a7cf6);
  --btn:var(--tg-theme-button-color,#2a7cf6);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --card:var(--tg-theme-section-bg-color,var(--bg));
  --sep:color-mix(in srgb,var(--hint) 22%,transparent);
  --accent:var(--tg-theme-accent-text-color,var(--btn));
  --danger:var(--tg-theme-destructive-text-color,#e5484d);
  --ok:#22a861;
  --soft:color-mix(in srgb,var(--btn) 12%,transparent);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:18px 16px 6px}
header .brand{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--hint);font-weight:600}
header h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
main{padding:6px 12px 16px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 0 var(--sep)}
.muted{color:var(--hint)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;scroll-snap-align:start;padding:10px 8px;border-radius:14px;background:var(--card);text-align:center;border:1.5px solid transparent;cursor:pointer}
.day .wd{font-size:12px;color:var(--hint);text-transform:uppercase;font-weight:600}
.day .dn{font-size:20px;font-weight:700;margin:2px 0}
.day .fr{font-size:11px;color:var(--ok);font-weight:600}
.day .fr.none{color:var(--hint)}
.day.active{border-color:var(--btn);background:var(--soft)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{border-radius:14px;padding:12px 8px;text-align:center;background:var(--card);border:1.5px solid var(--sep);cursor:pointer;user-select:none}
.slot .t{font-size:18px;font-weight:700}
.slot .s{font-size:11px;margin-top:2px;color:var(--hint)}
.slot.free{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.slot.free .s{color:var(--ok);font-weight:600}
.slot.taken{opacity:.45;cursor:default}
.slot.mine{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.slot.mine .s{color:var(--btn-text);opacity:.9}
.legend{display:flex;gap:14px;font-size:12px;color:var(--hint);margin:12px 4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--btn);color:var(--btn-text);cursor:pointer;width:100%}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.5}
.hero{background:linear-gradient(135deg,var(--btn),color-mix(in srgb,var(--btn) 60%,#7b2ff7));color:#fff;border-radius:20px;padding:18px}
.hero .big{font-size:44px;font-weight:800;line-height:1}
.hero .muted{color:rgba(255,255,255,.8)}
.plan{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan .p{font-weight:800;font-size:17px;white-space:nowrap}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .img{aspect-ratio:1/1;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px}
.prod .img img{width:100%;height:100%;object-fit:cover}
.prod .imgs{aspect-ratio:1/1;background:var(--soft);display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.prod .imgs::-webkit-scrollbar{display:none}
.prod .imgs img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;cursor:pointer}
.prod .dots{display:flex;justify-content:center;gap:4px;padding:6px 0 0}
.prod .dots i{width:6px;height:6px;border-radius:50%;background:var(--sep);display:block}
.prod .dots i.on{background:var(--accent)}
.lb{touch-action:pan-y}
.lb .nav{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:16px}
.prod .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .ti{font-weight:600;font-size:14px}
.prod .de{font-size:12px;color:var(--hint);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prod .pr{font-weight:800;margin-top:auto}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:10px;border:0;background:var(--soft);color:var(--accent);font-size:18px;font-weight:700}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}
.list .it:last-child{border-bottom:0}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--btn)}
label{display:block;font-size:13px;color:var(--hint);margin:12px 2px 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;padding:9px;border-radius:10px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--sep);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;position:relative}
nav button .ic{font-size:21px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--accent)} nav button.on .ic{filter:none;opacity:1}
.badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--danger);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet h3{margin:0 0 6px;font-size:19px}
@keyframes up{from{transform:translateY(40px);opacity:.4}} @keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--hint)} .empty .e{font-size:40px;margin-bottom:6px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,#f5a524 18%,transparent);color:#c27c00}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
h2{font-size:17px;margin:18px 4px 4px}
.person{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px;background:var(--soft);display:block}
.about-title{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:10px 4px 0;line-height:1.15}
.about-tag{color:var(--hint);margin:6px 4px 14px;font-size:16px}
.about-desc{white-space:pre-wrap;margin:0}
.facts .fact{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.facts .fact:last-child{border-bottom:0}
.facts .k{color:var(--hint);font-size:13px;flex:0 0 38%}
.facts .v{font-weight:600;text-align:right}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal .g{border-radius:14px;overflow:hidden;background:var(--card);aspect-ratio:1/1;position:relative;cursor:pointer}
.gal .g.wide{grid-column:1/-1;aspect-ratio:16/9;cursor:default}
.gal .g img,.gal .g video{width:100%;height:100%;object-fit:cover;display:block}
.gal .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px}
.embed{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pfl-img{width:100%;border-radius:12px;margin-bottom:8px;aspect-ratio:16/9;object-fit:cover;display:block}
.cta{display:flex;flex-direction:column;gap:8px;margin:16px 0 8px}
.pubbar{background:var(--soft);border-radius:14px;padding:12px 14px;margin:0 0 12px;text-align:center}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img,.lb video{max-width:100%;max-height:100%;border-radius:8px}
a.btn{text-decoration:none}
nav.tight button,nav.tight a{font-size:10px}
</style>
</head>
<body>
<header><div class="brand" id="brand">Flow by Zhenya</div><h1 id="title">Расписание</h1></header>
<main id="app"><div class="skel"></div><div class="skel"></div></main>
<nav id="nav"></nav>
<script>
const tg = window.Telegram ? Telegram.WebApp : null;
const S = {me:null, tab:'schedule', day:null, adminDay:null, shopCart:null, adminView:'schedule'};
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub = k => (k/100).toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' ₽';
const pd = s => { const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const dayLabel = s => { const d = pd(s); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; };
const dtLabel = s => `${dayLabel(s)}, ${s.slice(11,16)}`;
const hap = t => { try { tg?.HapticFeedback?.notificationOccurred(t); } catch(e){} };
const tap = () => { try { tg?.HapticFeedback?.impactOccurred('light'); } catch(e){} };

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function confirmBox(msg){ return new Promise(r => { if (tg?.showConfirm && tg.isVersionAtLeast?.('6.2')) tg.showConfirm(msg, ok => r(ok)); else r(confirm(msg)); }); }
function alertBox(msg){ return new Promise(r => { if (tg?.showAlert && tg.isVersionAtLeast?.('6.2')) tg.showAlert(msg, () => r()); else { alert(msg); r(); } }); }

async function api(path, body){
  const opt = {headers:{'X-Telegram-Init-Data': tg?.initData || ''}};
  if (body !== undefined){ opt.method='POST'; opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok){ const e = new Error((j && j.error) || ('Ошибка ' + r.status)); e.code = j && j.code; e.status = r.status; throw e; }
  return j;
}

function sheet(html){
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg); return bg;
}

const TABS = [
  {id:'about', ic:'🏠', t:'О проекте'},
  {id:'schedule', ic:'📅', t:'Расписание'},
  {id:'bookings', ic:'🗓', t:'Записи'},
  {id:'sub', ic:'🎫', t:'Абонемент'},
  {id:'shop', ic:'🛍', t:'Магазин'},
  {id:'admin', ic:'⚙️', t:'Тренер', owner:true},
];
function renderNav(){
  const n = document.getElementById('nav');
  if (S.public){
    const bot = (S.about && S.about.bot_url) || 'https://t.me/Flowbyzhenya_bot';
    n.innerHTML = `<button class="on"><span class="ic">🏠</span>О проекте</button>
      <a href="${esc(bot)}" style="flex:1;text-decoration:none;color:var(--hint);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0"><span class="ic" style="font-size:21px">📱</span>Бот</a>`;
    n.classList.remove('tight');
    return;
  }
  const tabs = TABS.filter(t => !t.owner || S.me?.is_owner);
  n.classList.toggle('tight', tabs.length > 5);
  n.innerHTML = tabs.map(t =>
    `<button class="${S.tab===t.id?'on':''}" data-tab="${t.id}"><span class="ic">${t.ic}</span>${t.t}${t.id==='shop' && S.me?.cart_count ? `<span class="badge">${S.me.cart_count}</span>`:''}</button>`).join('');
  n.querySelectorAll('button').forEach(b => b.onclick = () => { tap(); go(b.dataset.tab); });
}
function go(tab){
  if (S.public && tab !== 'about'){
    location.href = (S.about && S.about.bot_url) || 'https://t.me/Flowbyzhenya_bot';
    return;
  }
  S.tab = tab; renderNav();
  const t = TABS.find(x=>x.id===tab);
  document.getElementById('title').textContent = t && t.id==='admin' ? 'Кабинет тренера' : (t ? t.t : '');
  $app.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  window.scrollTo(0,0);
  ({about:viewAbout, schedule:viewSchedule, bookings:viewBookings, sub:viewSub, shop:viewShop, admin:viewAdmin})[tab]().catch(showErr);
}
function openAboutCta(tab){
  if (S.public){
    location.href = (S.about && S.about.bot_url) || 'https://t.me/Flowbyzhenya_bot';
    return;
  }
  go(tab);
}
function lightbox(html){
  const bg = document.createElement('div'); bg.className = 'lb'; bg.innerHTML = html;
  bg.onclick = () => bg.remove();
  document.body.appendChild(bg);
}

/* ---------- О проекте ---------- */
function mediaBlock(item, wide){
  const cap = item.caption ? `<div class="cap">${esc(item.caption)}</div>` : '';
  if (item.embed){
    return `<div class="g wide"><div class="embed"><iframe src="${esc(item.embed)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy" title=""></iframe></div>${cap}</div>`;
  }
  if (item.kind === 'link' && item.url){
    return `<div class="g wide" style="aspect-ratio:auto;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center"><a href="${esc(item.url)}" target="_blank" rel="noopener" style="color:var(--link);font-weight:600">${esc(item.caption || item.url)}</a></div>`;
  }
  if (item.kind === 'video' && item.src){
    return `<div class="g ${wide?'wide':''}" data-src="${esc(item.src)}" data-kind="video">${cap}<video src="${esc(item.src)}" preload="metadata" playsinline></video></div>`;
  }
  if (item.src){
    return `<div class="g" data-src="${esc(item.src)}" data-kind="photo"><img src="${esc(item.src)}" alt="${esc(item.caption||'')}" loading="lazy">${cap}</div>`;
  }
  return '';
}
async function viewAbout(){
  const a = await fetch('/api/public/about').then(r => { if(!r.ok) throw new Error('Не удалось загрузить страницу'); return r.json(); });
  S.about = a;
  if (a.studio) document.getElementById('brand').textContent = a.studio;
  if (a.title) document.title = a.title;
  document.getElementById('title').textContent = 'О проекте';
  renderNav();
  const facts = (a.facts||[]).map(f => f.label
    ? `<div class="fact"><div class="k">${esc(f.label)}</div><div class="v">${esc(f.value)}</div></div>`
    : `<div class="fact"><div class="v" style="text-align:left;flex:1">${esc(f.value)}</div></div>`).join('');
  const gal = (a.gallery||[]).map(g => mediaBlock(g, g.kind!=='photo')).join('');
  const pfl = (a.portfolio||[]).map(p => `<div class="card">${p.src ? `<img class="pfl-img" src="${esc(p.src)}" alt="" loading="lazy">` : ''}
    ${p.title ? `<b>${esc(p.title)}</b>` : ''}${p.text ? `<div class="small" style="white-space:pre-wrap;margin-top:6px">${esc(p.text)}</div>` : ''}</div>`).join('');
  const bot = a.bot_url || 'https://t.me/Flowbyzhenya_bot';
  const cta = S.public
    ? `<div class="cta"><a class="btn" href="${esc(bot)}">📅 Записаться на тренировку</a><a class="btn sec" href="${esc(bot)}">🛍 Открыть магазин в боте</a><a class="btn sec" href="${esc(bot)}">📱 Открыть бота @Flowbyzhenya_bot</a></div>`
    : `<div class="cta"><button class="btn" id="ctaSch">📅 Записаться на тренировку</button><button class="btn sec" id="ctaShop">🛍 Перейти в магазин</button></div>`;
  $app.innerHTML = `
    ${S.public ? `<div class="pubbar small">Страница студии. Запись и магазин — в Telegram-боте<br><a href="${esc(bot)}" style="color:var(--link);font-weight:600">@Flowbyzhenya_bot</a></div>` : ''}
    ${a.cover ? `<img class="cover" src="${esc(a.cover)}" alt="">` : ''}
    <div class="about-title">${esc(a.title || a.studio || 'О проекте')}</div>
    ${a.tagline ? `<div class="about-tag">${esc(a.tagline)}</div>` : ''}
    ${a.description ? `<div class="card about-desc">${esc(a.description)}</div>` : ''}
    ${facts ? `<div class="card facts">${facts}</div>` : ''}
    ${gal ? `<h2>Галерея</h2><div class="gal">${gal}</div>` : ''}
    ${pfl ? `<h2>Портфолио</h2><div class="pfl">${pfl}</div>` : ''}
    ${cta}`;
  document.getElementById('ctaSch')?.addEventListener('click', () => openAboutCta('schedule'));
  document.getElementById('ctaShop')?.addEventListener('click', () => openAboutCta('shop'));
  $app.querySelectorAll('.g[data-src]').forEach(el => el.onclick = () => {
    const src = el.dataset.src;
    if (el.dataset.kind === 'video') lightbox(`<video src="${esc(src)}" controls autoplay playsinline></video>`);
    else lightbox(`<img src="${esc(src)}" alt="">`);
  });
}
function showErr(e){ $app.innerHTML = `<div class="empty"><div class="e">😕</div>${esc(e.message)}<br><br><button class="btn sec sm" onclick="go(S.tab)">Повторить</button></div>`; }
async function refreshMe(){ S.me = await api('/api/me'); renderNav(); }

/* ---------- Расписание ---------- */
async function viewSchedule(){
  const days = await api('/api/days');
  if (!days.length){ $app.innerHTML = `<div class="empty"><div class="e">🗓</div>Свободного времени на ближайший месяц пока нет.</div>`; return; }
  if (!S.day || !days.find(d=>d.date===S.day)) S.day = (days.find(d=>d.free>0) || days[0]).date;
  const subLine = S.me.sub.left > 0 ? `Доступно занятий: <b>${S.me.sub.left}</b>` : `Нет активного абонемента — <a href="#" id="toSub" style="color:var(--link)">купить</a>`;
  $app.innerHTML = `
    <div class="days">${days.map(d => { const x=pd(d.date); return `<div class="day ${d.date===S.day?'active':''}" data-d="${d.date}">
      <div class="wd">${WD[x.getDay()]}</div><div class="dn">${x.getDate()}</div><div class="fr ${d.free?'':'none'}">${d.free?d.free+' своб.':'занято'}</div></div>`; }).join('')}</div>
    <div class="row between small muted" style="margin:0 4px 8px"><span>${dayLabel(S.day)}</span><span>${subLine}</span></div>
    <div id="slots"><div class="skel"></div></div>
    <div class="legend"><span><i class="dot" style="background:var(--ok)"></i>свободно</span><span><i class="dot" style="background:var(--btn)"></i>вы записаны</span><span><i class="dot" style="background:var(--hint)"></i>занято</span></div>`;
  $app.querySelectorAll('.day').forEach(el => el.onclick = () => { tap(); S.day = el.dataset.d; viewSchedule().catch(showErr); });
  document.getElementById('toSub')?.addEventListener('click', e => { e.preventDefault(); go('sub'); });
  $app.querySelector('.day.active')?.scrollIntoView({inline:'center', block:'nearest'});
  const slots = await api('/api/slots?date=' + S.day);
  const box = document.getElementById('slots');
  if (!slots.length){ box.innerHTML = `<div class="empty">На этот день свободного времени нет.</div>`; return; }
  box.innerHTML = `<div class="slots">${slots.map(s => `<div class="slot ${s.status}" data-id="${s.id}">
    <div class="t">${s.time}</div><div class="s">${s.status==='mine'?'вы записаны':s.status==='free'?(s.capacity>1?`мест: ${s.capacity-s.booked}`:'свободно'):'занято'}</div>
    ${s.capacity>1?`<div class="s">${esc(s.title)}</div>`:''}</div>`).join('')}</div>`;
  box.querySelectorAll('.slot').forEach(el => el.onclick = () => {
    const s = slots.find(x => x.id == el.dataset.id);
    if (s.status === 'free') bookSheet(s); else if (s.status === 'mine') cancelBooking(s.booking_id, `${dayLabel(S.day)}, ${s.time}`);
  });
}
function bookSheet(s){
  const sh = sheet(`<h3>${dayLabel(S.day)}, ${s.time}</h3>
    <div class="muted">${esc(s.title)} · ${s.duration} мин</div>
    <div class="card" style="background:var(--bg2)">С абонемента спишется <b>1 занятие</b> (сейчас доступно: ${S.me.sub.left}).<br>
    <span class="small muted">Отменить можно не позднее чем за ${S.me.cancel_hours} ч — занятие вернётся.</span></div>
    <button class="btn" id="ok">Записаться</button><div style="height:8px"></div><button class="btn sec" id="no">Отмена</button>`);
  sh.querySelector('#no').onclick = () => sh.remove();
  sh.querySelector('#ok').onclick = async (ev) => {
    ev.target.disabled = true;
    try { await api('/api/book', {slot_id: s.id}); hap('success'); sh.remove(); toast('✅ Вы записаны!'); await refreshMe(); viewSchedule().catch(showErr); }
    catch(e){ sh.remove(); hap('error');
      if (e.code === 'NO_SUB'){ if (await confirmBox(e.message + '\n\nПерейти к покупке абонемента?')) go('sub'); }
      else { await alertBox(e.message); viewSchedule().catch(showErr); } }
  };
}
async function cancelBooking(id, label){
  if (!await confirmBox(`Отменить запись на ${label}?`)) return;
  try { await api('/api/cancel', {booking_id:id}); hap('success'); toast('Запись отменена, занятие вернулось'); await refreshMe(); go(S.tab); }
  catch(e){ hap('error'); alertBox(e.message); }
}

/* ---------- Мои записи ---------- */
async function viewBookings(){
  const [bs, orders] = await Promise.all([api('/api/bookings'), api('/api/orders')]);
  let h = '';
  if (!bs.length) h += `<div class="card empty"><div class="e">🧘</div>Предстоящих записей нет<br><br><button class="btn sm" onclick="go('schedule')">Выбрать время</button></div>`;
  else h += `<div class="card list">${bs.map(b => `<div class="it"><div><b>${dtLabel(b.start)}</b><div class="small muted">${esc(b.title)}</div></div>
     ${b.can_cancel ? `<button class="btn danger sm" data-id="${b.id}" data-l="${esc(dtLabel(b.start))}">Отменить</button>` : `<span class="small muted" style="max-width:110px;text-align:right">отмена недоступна (&lt; ${S.me.cancel_hours} ч)</span>`}</div>`).join('')}</div>
     <div class="small muted" style="margin:0 6px">Отмена возможна не позднее чем за ${S.me.cancel_hours} ч до начала.</div>`;

     <div style="text-align:right"><span class="pill">${esc(o.status)}</span><div class="small ${o.paid?'':'muted'}" style="margin-top:4px">${o.paid?'оплачен':'не оплачен'}</div></div></div>`).join('')}</div>`;

  $app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => cancelBooking(+b.dataset.id, b.dataset.l));

/* ---------- Абонемент ---------- */
async function viewSub(){
  await refreshMe();
  const plans = await api('/api/plans');
  const sub = S.me.sub;
  const exp = sub.subs.length ? sub.subs.map(s => `<div class="small muted">${esc(s.title)}: ${s.left} из ${s.total}, до ${pd(s.expires).toLocaleDateString('ru-RU')}</div>`).join('') : '<div class="small muted">Нет действующего абонемента</div>';
  $app.innerHTML = `<div class="hero"><div class="muted small">Осталось занятий</div><div class="big">${sub.left}</div><div style="margin-top:8px">${exp.replaceAll('muted','')}</div></div>
    <h2>Купить абонемент</h2>
    ${plans.length ? plans.map(p => `<div class="card plan"><div><b>${esc(p.title)}</b><div class="small muted">${p.sessions} занятий · ${p.days} дней</div></div>
      <div style="text-align:right"><div class="p">${rub(p.price)}</div><button class="btn sm" style="margin-top:6px" data-id="${p.id}">Купить</button></div></div>`).join('') : '<div class="empty">Тарифы пока не настроены</div>'}
    ${S.me.payments ? '' : '<div class="small muted" style="margin:6px">💡 Онлайн-оплата скоро будет подключена. Сейчас заявка уходит тренеру, а после оплаты абонемент появится здесь.</div>'}`;
  $app.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
    const p = plans.find(x => x.id == b.dataset.id);
    if (!S.me.payments && !await confirmBox(`Отправить тренеру заявку на «${p.title}» (${rub(p.price)})?`)) return;
    b.disabled = true;
    try {
      const r = await api('/api/buy', {plan_id: p.id});
      if (r.invoice_url) openInvoice(r.invoice_url, () => viewSub().catch(showErr));
      else { hap('success'); alertBox('Заявка отправлена тренеру ✅\nОн свяжется с вами, и после оплаты абонемент появится в приложении.'); }
    } catch(e){ hap('error'); alertBox(e.message); }
    b.disabled = false;
  });
}
function openInvoice(url, done){
  if (tg?.openInvoice) tg.openInvoice(url, status => {
    if (status === 'paid'){ hap('success'); toast('✅ Оплата прошла!'); setTimeout(done, 1500); }
    else if (status === 'failed'){ hap('error'); alertBox('Оплата не прошла. Попробуйте ещё раз.'); }
  }); else window.open(url, '_blank');
}

/* ---------- Магазин ---------- */
function productImgs(p){
  const urls = (p.photos && p.photos.length) ? p.photos : (p.photo ? [p.photo] : []);
  if (!urls.length) return `<div class="img">🏋️</div>`;
  const dots = urls.length > 1 ? `<div class="dots">${urls.map((_,i)=>`<i${i===0?' class="on"':''}></i>`).join('')}</div>` : '';
  return `<div class="imgs">${urls.map((u,i)=>`<img src="${esc(u)}" alt="" loading="${i?'lazy':'eager'}">`).join('')}</div>${dots}`;
}
function shopLightbox(urls, start){
  let i = start;
  const bg = document.createElement('div'); bg.className = 'lb';
  const pic = document.createElement('img');
  const show = () => { pic.src = urls[i]; };
  show();
  bg.appendChild(pic);
  if (urls.length > 1){
    const nav = document.createElement('div'); nav.className = 'nav';
    nav.innerHTML = `<button type="button" class="btn sm" data-d="-1">‹</button><button type="button" class="btn sm" data-d="1">›</button>`;
    bg.appendChild(nav);
    const step = d => { i = (i + d + urls.length) % urls.length; show(); };
    nav.onclick = ev => { ev.stopPropagation(); const b = ev.target.closest('[data-d]'); if (b) step(+b.dataset.d); };
    let x0 = null;
    bg.addEventListener('touchstart', ev => { x0 = ev.changedTouches[0].clientX; }, {passive:true});
    bg.addEventListener('touchend', ev => {
      if (x0 == null) return;
      const dx = ev.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
    });
  }
  bg.onclick = ev => { if (ev.target === bg || ev.target === pic) bg.remove(); };
  document.body.appendChild(bg);
}
async function viewShop(){
  const [prods, cart] = await Promise.all([api('/api/products'), api('/api/cart')]);
  S.shopCart = cart;
  const q = id => (cart.items.find(i => i.product_id === id) || {}).qty || 0;
  if (!prods.length){ $app.innerHTML = '<div class="empty"><div class="e">🛍</div>Магазин пока пуст</div>'; return; }
  $app.innerHTML = `<div class="products">${prods.map(p => `<div class="prod">${productImgs(p)}
     <div class="b"><div class="ti">${esc(p.title)}</div><div class="de">${esc(p.description)}</div><div class="pr">${rub(p.price)}</div>
     ${q(p.id) ? `<div class="qty"><button data-d="-1" data-p="${p.id}">−</button><b>${q(p.id)}</b><button data-d="1" data-p="${p.id}">+</button></div>` : `<button class="btn sm" style="width:100%" data-d="1" data-p="${p.id}">В корзину</button>`}
     </div></div>`).join('')}</div>
     ${cart.items.length ? `<div style="height:70px"></div><div style="position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:4"><button class="btn" id="checkout" style="box-shadow:0 6px 20px rgba(0,0,0,.2)">🛒 Корзина · ${rub(cart.total)}</button></div>` : ''}`;
  $app.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    tap(); b.disabled = true;
    try { await api('/api/cart', {product_id:+b.dataset.p, delta:+b.dataset.d}); await refreshMe(); await viewShop(); } catch(e){ alertBox(e.message); }
  });
  $app.querySelectorAll('.prod').forEach(card => {
    const el = card.querySelector('.imgs'); if (!el) return;
    const dots = card.querySelectorAll('.dots i');
    const imgs = [...el.querySelectorAll('img')];
    el.addEventListener('scroll', () => {
      const i = Math.round(el.scrollLeft / Math.max(el.clientWidth, 1));
      dots.forEach((d,j) => d.classList.toggle('on', j===i));
    }, {passive:true});
    imgs.forEach((img, idx) => img.onclick = ev => { ev.preventDefault(); shopLightbox(imgs.map(x=>x.src), idx); });
  });
  document.getElementById('checkout')?.addEventListener('click', checkoutSheet);
}
function checkoutSheet(){
  const c = S.shopCart; let mode = 'pickup';
  const sh = sheet(`<h3>Оформление заказа</h3>
    <div class="list">${c.items.map(i => `<div class="it"><span>${esc(i.title)} × ${i.qty}</span><b>${rub(i.price*i.qty)}</b></div>`).join('')}
    <div class="it"><span>Итого</span><b style="font-size:18px">${rub(c.total)}</b></div></div>
    <label>Способ получения</label>
    <div class="seg"><button class="on" data-m="pickup">🏠 Самовывоз</button><button data-m="delivery">🚚 Доставка</button></div>
    <div id="pickupInfo" class="small muted" style="margin:8px 2px">Самовывоз из студии: ${esc(S.me.address)}</div>
    <div id="addrBox" style="display:none"><label>Адрес доставки</label><textarea id="addr" rows="2" placeholder="Город, улица, дом, квартира, комментарий"></textarea></div>
    <label>Телефон</label><input id="phone" type="tel" inputmode="tel" placeholder="+7 900 123-45-67" value="${esc(S.me.phone||'')}">
    <div style="height:14px"></div><button class="btn" id="go">Подтвердить заказ</button>
    <div style="height:8px"></div><button class="btn sec" id="no">Отмена</button>`);
  sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m;
    sh.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x===b));
    sh.querySelector('#addrBox').style.display = mode==='delivery' ? '' : 'none';
    sh.querySelector('#pickupInfo').style.display = mode==='pickup' ? '' : 'none'; });
  sh.querySelector('#no').onclick = () => sh.remove();
  sh.querySelector('#go').onclick = async (ev) => {
    ev.target.disabled = true;
    try {
      const r = await api('/api/order', {delivery: mode, address: sh.querySelector('#addr').value, phone: sh.querySelector('#phone').value});
      sh.remove(); hap('success'); await refreshMe();
      if (r.invoice_url) openInvoice(r.invoice_url, () => go('bookings'));
      else await alertBox(`Заказ №${r.order_id} оформлен на ${rub(r.total)} ✅\nОнлайн-оплата скоро появится. Тренер свяжется с вами, чтобы подтвердить заказ и оплату.`);
      go('shop');
    } catch(e){ ev.target.disabled = false; hap('error'); alertBox(e.message); }
  };
}

/* ---------- Кабинет тренера ---------- */
async function viewAdmin(){
  $app.innerHTML = `<div class="seg" style="margin-bottom:8px"><button data-v="schedule" class="${S.adminView==='schedule'?'on':''}">📅 Расписание</button><button data-v="orders" class="${S.adminView==='orders'?'on':''}">📦 Заказы</button></div><div id="adm"><div class="skel"></div></div>`;
  $app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.adminView = b.dataset.v; viewAdmin().catch(showErr); });
  return S.adminView === 'orders' ? adminOrders() : adminSchedule();
}
async function adminSchedule(){
  const days = await api('/api/admin/days');
  if (!S.adminDay) S.adminDay = (days.find(d => d.slots > 0) || days[0]).date;
  const slots = await api('/api/admin/day?date=' + S.adminDay);
  const box = document.getElementById('adm');
  const total = slots.reduce((a,s)=>a+s.booked,0);
  box.innerHTML = `<div class="days">${days.map(d => { const x=pd(d.date); return `<div class="day ${d.date===S.adminDay?'active':''}" data-d="${d.date}">
      <div class="wd">${WD[x.getDay()]}</div><div class="dn">${x.getDate()}</div><div class="fr ${d.booked?'':'none'}">${d.booked} зап. / ${d.slots}</div></div>`; }).join('')}</div>
    <div class="row between" style="margin:0 4px"><b>${dayLabel(S.adminDay)}</b><span class="small muted">записей: ${total}, слотов: ${slots.length}</span></div>
    ${slots.length ? slots.map(s => `<div class="card" style="padding:12px ${s.past?';opacity:.55':''}">
      <div class="row between"><div><b style="font-size:17px">${s.time}</b> <span class="small muted">${esc(s.title)}</span></div>
      <div class="row"><span class="pill ${s.booked>=s.capacity?'warn':s.booked?'ok':''}">${s.booked}/${s.capacity}</span>
      <button class="btn danger sm" data-del="${s.id}" data-b="${s.booked}">🗑</button></div></div>
      ${s.people.map(p => `<div class="person"><div><div>${esc(p.name)}${p.username?` <span class="muted small">@${esc(p.username)}</span>`:''}</div>${p.phone?`<div class="small muted">${esc(p.phone)}</div>`:''}</div>
        <button class="btn sec sm" data-cb="${p.booking_id}" data-n="${esc(p.name)}">Отменить</button></div>`).join('')}</div>`).join('') : '<div class="empty">Слотов нет</div>'}
    <div class="card"><b>Добавить слоты на этот день</b>
      <label>Время (через запятую)</label><input id="times" placeholder="9:00, 10:00, 18:30">
      <div class="row"><div style="flex:1"><label>Мест</label><input id="cap" type="number" min="1" value="1"></div>
      <div style="flex:2"><label>Название (необязательно)</label><input id="ttl" placeholder="Персональная тренировка"></div></div>
      <div style="height:12px"></div><button class="btn" id="add">Добавить</button></div>
    <button class="btn danger" id="clr">🧹 Удалить все свободные слоты дня</button>
    <div class="small muted" style="margin:10px 4px">Шаблон недели, тарифы, товары и начисление занятий — в боте: кнопка «⚙️ Админ».</div>`;
  box.querySelectorAll('.day').forEach(el => el.onclick = () => { tap(); S.adminDay = el.dataset.d; adminSchedule().catch(showErr); });
  box.querySelector('.day.active')?.scrollIntoView({inline:'center', block:'nearest'});
  box.querySelectorAll('[data-cb]').forEach(b => b.onclick = async () => {
    if (!await confirmBox(`Отменить запись клиента ${b.dataset.n}? Занятие вернётся, клиент получит уведомление.`)) return;
    try { await api('/api/admin/booking/cancel', {booking_id:+b.dataset.cb}); hap('success'); toast('Запись отменена'); adminSchedule(); } catch(e){ alertBox(e.message); }
  });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const booked = +b.dataset.b;
    if (!await confirmBox(booked ? `На слот записано ${booked} чел. Удалить слот? Записи отменятся, занятия вернутся, клиенты получат уведомление.` : 'Удалить слот?')) return;
    try { await api('/api/admin/slot/delete', {slot_id:+b.dataset.del, force: booked>0}); hap('success'); adminSchedule(); } catch(e){ alertBox(e.message); }
  });
  box.querySelector('#add').onclick = async () => {
    const times = box.querySelector('#times').value.split(/[,;\s]+/).filter(Boolean);
    if (!times.length) return alertBox('Укажите время, например 9:00, 18:30');
    try { const r = await api('/api/admin/slots', {date:S.adminDay, times, capacity:+box.querySelector('#cap').value||1, title:box.querySelector('#ttl').value});
      hap('success'); toast('Добавлено: ' + r.added.join(', ')); adminSchedule(); } catch(e){ alertBox(e.message); }
  };
  box.querySelector('#clr').onclick = async () => {
    if (!await confirmBox('Удалить все слоты этого дня, на которые никто не записан?')) return;
    try { const r = await api('/api/admin/clear_free', {date:S.adminDay}); toast('Удалено слотов: ' + r.deleted); adminSchedule(); } catch(e){ alertBox(e.message); }
  };
}
async function adminOrders(){
  const {orders, statuses} = await api('/api/admin/orders');
  const box = document.getElementById('adm');
  if (!orders.length){ box.innerHTML = '<div class="empty"><div class="e">📦</div>Заказов пока нет</div>'; return; }
  box.innerHTML = orders.map(o => `<div class="card">
    <div class="row between"><b>№${o.id} · ${rub(o.total)}</b><span class="small muted">${esc(o.created)}</span></div>
    <div class="small" style="margin:4px 0">${esc(o.client)}${o.username?' @'+esc(o.username):''} · ${esc(o.phone||'')}</div>
    <div class="small muted">${o.items.map(i => `${esc(i.title)} × ${i.qty}`).join('<br>')}</div>
    <div class="small" style="margin-top:4px">${o.delivery==='delivery' ? '🚚 ' + esc(o.address) : '🏠 Самовывоз'}</div>
    <div class="row" style="margin-top:10px"><select data-o="${o.id}" style="flex:1">${Object.entries(statuses).map(([k,v]) => `<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select>
    <button class="btn sm ${o.paid?'':'sec'}" data-paid="${o.id}" data-v="${o.paid?0:1}">${o.paid?'💰 Оплачен':'Не оплачен'}</button></div></div>`).join('');
  box.querySelectorAll('select[data-o]').forEach(s => s.onchange = async () => {
    try { await api('/api/admin/order', {order_id:+s.dataset.o, status:s.value}); hap('success'); toast('Статус обновлён, клиент уведомлён'); } catch(e){ alertBox(e.message); adminOrders(); }
  });
  box.querySelectorAll('[data-paid]').forEach(b => b.onclick = async () => {
    try { await api('/api/admin/order', {order_id:+b.dataset.paid, paid:!!+b.dataset.v}); adminOrders(); } catch(e){ alertBox(e.message); }
  });
}
